spring.application.name=booking-system
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking_system}
spring.datasource.username=${DB_USERNAME:booking}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
spring.mvc.problemdetails.enabled=true
server.port=${PORT:8090}
server.error.include-message=never
booking.time-zone=America/Los_Angeles
