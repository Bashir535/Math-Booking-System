spring.application.name=booking-system
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking_system}
spring.datasource.username=${DB_USERNAME:booking}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
spring.mvc.problemdetails.enabled=true
server.port=${PORT:8090}
server.error.include-message=never
booking.time-zone=America/Los_Angeles

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never

notification.url=${NOTIFICATION_URL:http://localhost:${server.port}/internal/notifications}
notification.api-key=${NOTIFICATION_API_KEY:local-development-key}
notification.timeout-ms=${NOTIFICATION_TIMEOUT_MS:1000}
notification.stub.available=${NOTIFICATION_STUB_AVAILABLE:true}
notification.stub.delay-ms=${NOTIFICATION_STUB_DELAY_MS:0}
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.socketTimeout=5
logging.level.root=INFO
logging.level.com.example.bookingsystem=INFO
