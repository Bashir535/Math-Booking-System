name: booking-system

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8090"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booking_system
      DB_USERNAME: booking
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BOOKING_DEMO_PASSWORD:
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:-local-development-key}
      NOTIFICATION_STUB_AVAILABLE: ${NOTIFICATION_STUB_AVAILABLE:-true}
      NOTIFICATION_STUB_DELAY_MS: ${NOTIFICATION_STUB_DELAY_MS:-0}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking_system
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  booking_data:
