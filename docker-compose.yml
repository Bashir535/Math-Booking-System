name: booking-system

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking_system
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  booking_data:
